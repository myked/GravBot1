; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:uno]
platform = atmelavr
board = uno
framework = arduino
build_src_filter = +<*> -<stages/>

lib_deps =
    Servo

; ---- Staged bring-up environments ----
; Each stage is a standalone sketch in src/stages/, flashable on its own
; without touching the main.cpp full sketch. Build/upload a specific
; stage with, e.g.:
;   pio run -e stage1_encoders_only -t upload
; then open its serial monitor the same way you would for env:uno.

[env:stage1_encoders_only]
platform = atmelavr
board = uno
framework = arduino
build_src_filter = -<*> +<stages/stage1_encoders_only.cpp>

[env:stage2_open_loop_drive]
platform = atmelavr
board = uno
framework = arduino
build_src_filter = -<*> +<stages/stage2_open_loop_drive.cpp>

lib_deps =
    Servo

[env:stage3_single_side_pid]
platform = atmelavr
board = uno
framework = arduino
build_src_filter = -<*> +<stages/stage3_single_side_pid.cpp>

lib_deps =
    Servo

[env:stage4_full_dual_pid]
platform = atmelavr
board = uno
framework = arduino
build_src_filter = -<*> +<stages/stage4_full_dual_pid.cpp>

lib_deps =
